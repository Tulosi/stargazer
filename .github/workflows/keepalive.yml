# Supabase pauses free projects after about a week with no activity. This pings yours twice a week so it stays awake.
# Add two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions).
name: keep-supabase-awake
on:
  schedule: [{cron: "17 6 * * 1,4"}]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/saved_posts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null -w "status %{http_code}\n" || true
