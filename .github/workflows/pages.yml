# Publishes the site/ folder to GitHub Pages on every push to main.
# One-time: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: deploy-pages
on:
  push: {branches: [main], paths: ["site/**", ".github/workflows/pages.yml"]}
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      # Offer the same page as a download. A .zip makes the browser save it instead of just opening the page; it is built here so it can never drift from index.html.
      - run: |
          mkdir -p /tmp/pack && cp site/index.html /tmp/pack/stargazer.html
          (cd /tmp/pack && zip -q stargazer.zip stargazer.html)
          cp /tmp/pack/stargazer.zip site/stargazer.zip
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: d
        uses: actions/deploy-pages@v4
